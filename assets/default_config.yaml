# Default grovems pipeline config. Copy this file and edit the values you need to
# change -- fields not present in your copy fall back to grovems.config.GrovemsConfig's
# own defaults (the same values shown here). Override any single value for one run
# without editing the file via `grovems run --config this.yaml --set key=value`.

# ---- stage toggles ----
run_rescoring: true
run_psa: true
run_iforest: true
run_postprocess: true
# Extra QC plots (shared-scan/PSM Venn, Levenshtein distance, peptide length,
# percolator-vs-isolation-score) -- opt-in, not part of the standard pipeline.
run_plotting: false

outdir: results

# ---- rescoring stage: inputs ----
database_search_path: null   # dir of MSFragger/FragPipe combined search results
denovo_search_path: null     # dir of Casanovo search results
rawdata_path: null           # dir of mzML spectra
database_search_type: Msfragger
denovo_search_type: Casanovo
spectra_type: mzML

# Point at an existing Oktoberfest output directory to skip running Oktoberfest for
# that branch (used in place -- rescore.tab still gets filtered/consumed as usual).
# Set one, both, or neither; the corresponding *_search_path/rawdata_path above are
# only required for branches that aren't reused this way.
database_oktoberfest_dir: null
denovo_oktoberfest_dir: null

# ---- rescoring stage: Oktoberfest / Prosit ----
irt_model: Prosit_2019_irt
intensity_model: Prosit_2020_intensity_HCD
prediction_server: koina.wilhelmlab.org:443
fdr_estimation_method: percolator
all_features: false
regression_method: spline
ssl: true
thermo_exe: null             # path to a local ThermoRawFileParser.exe; unset uses Oktoberfest's own default
mass_tolerance: 20
p_window: 1.2
unit_mass_tolerance: ppm
fragmentation_method: HCD
num_threads: null            # unset uses os.cpu_count()

# ---- rescoring stage: column filtering before Percolator ----
drop_columns_database: "lda_scores annotated_ions delta_mass_ppm log10_evalue next_score collision_energy_aligned"
drop_columns_denovo: "lda_scores collision_energy_aligned"

# ---- rescoring stage: Percolator ----
# Percolator is provided externally -- not a pyproject.toml dependency. Point one of
# these at your install:
#   percolator_exe    command/path to invoke (default: bare 'percolator', resolved via PATH)
#   percolator_module environment-module name (e.g. percolator/3.7.1) for sites using
#                     Environment Modules / Lmod; loaded before percolator_exe runs.
percolator_exe: percolator
percolator_module: ""
percolator_threads: 3
percolator_subset_max_train: 100000
percolator_test_fdr: 0.01
percolator_train_fdr: 0.01
percolator_verbose: 3

# ---- psa stage ----
psa_max_raw_files: null      # limit to first N raw files, for testing
overwrite_outputs: false     # overwrite existing per-RAW output files (merged/, grove_forest/)
psa_max_workers: null        # unset uses os.cpu_count()

# ---- iforest stage ----
# SUOD feature columns to train/score on.
iforest_features:
  - abs_rt_diff
  - fraction_not_observed_but_predicted
  - fraction_not_observed_but_predicted_vs_predicted
  - fraction_not_observed_and_not_predicted
  - fraction_not_observed_and_not_predicted_vs_predicted
  - fraction_observed
  - fraction_predicted
  - fraction_observed_and_predicted
  - fraction_observed_and_predicted_vs_predicted
  - fraction_observed_but_not_predicted
  - fraction_observed_but_not_predicted_vs_predicted
  - spectral_angle
# How the SUOD training set is picked:
#   percolator_percentile (default) -- trusted shared PSMs (target, database-side
#       Percolator score > 0), then the top 30% by that Percolator score.
#   denovo_score -- PSMs with a de novo call (denovo_only or shared) whose SCORE_denovo
#       is at least iforest_denovo_score_threshold, independent of Percolator/database.
iforest_training_source: percolator_percentile
iforest_denovo_score_threshold: 0.9   # only used when iforest_training_source is denovo_score
# Only needed when run_iforest is true but run_psa is false (standalone iforest run);
# otherwise the PSA stage's own grove_forest/ output is used directly.
grove_forest_dir: null
