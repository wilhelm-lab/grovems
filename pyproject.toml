[project]
name = "grovems"
version = "0.0.1"
description = "Oktoberfest/Percolator rescoring + PSA + SUOD IForest scoring for denovo_fdr"
authors = [{name = "Wilhelmlab at Technical University of Munich"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "spectrum_fundamentals @ git+https://github.com/wilhelm-lab/spectrum_fundamentals.git@feature/denovo_fdr",
    "spectrum_io @ git+https://github.com/wilhelm-lab/spectrum_io.git@feature/denovo_fdr",
    "oktoberfest @ git+https://github.com/wilhelm-lab/oktoberfest.git@feature/denovo_fdr",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "biopython>=1.83",
    "pyod>=2.0",
    "combo>=0.1.3",
    "suod>=0.1.4",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
homepage = "https://github.com/wilhelm-lab/grovems"
repository = "https://github.com/wilhelm-lab/grovems"
documentation = "https://grovems.readthedocs.io"

[project.scripts]
grovems = "grovems.__main__:main"

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-autodoc-typehints>=3.0",
    "sphinx-book-theme>=1.0.1",
    "sphinx-jinja>=2.0.2",
    "Pygments>=2.20.0",
]

[tool.poetry]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
coverage = {extras = ["toml"], version = ">=5.3"}
typeguard = ">=4.5.2"
xdoctest = {extras = ["colors"], version = ">=1.3.0"}
pre-commit = ">=4.6.0"
ruff = ">=0.15.0"
pre-commit-hooks = ">=4.4.0"
mypy = ">=0.910"

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["B", "C", "D", "E", "F", "N", "S", "W"]
ignore = [
    "E203",  # whitespace before colon (conflicts with formatter)
    "E501",  # line too long (handled by formatter)
    "D100",  # Missing module docstring
    "D212",  # Multi-line docstring summary should start at first line
    "S404",  # subprocess module usage
    "S602",  # shell=True used in subprocess
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Use of assert detected
"**/__init__.py" = ["F401", "F403"]  # Unused import / wildcard imports

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# line-length inherited from [tool.ruff]

[tool.mypy]
strict = false
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
ignore_missing_imports = true

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["grovems"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:"
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.setuptools_scm]
